[package]
name = "zellij-cockpit"
version = "0.1.0"
authors = ["Aymeric Ferreira"]
edition = "2024"
description = "An all-in-one Zellij top bar: system load, Claude usage, and per-tab attention icons."
license = "MIT"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[dependencies]
# Shared (both the native helper and the WASM plugin)
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["std"] }

# Plugin (WASM) only
zellij-tile = { version = "0.44.3", optional = true }
colored = { version = "3.0.0", optional = true }

# Native helper only
sysinfo = { version = "0.37.2", optional = true }
chrono = { version = "0.4", optional = true }
walkdir = { version = "2", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"], optional = true }

[features]
native = ["sysinfo", "chrono", "walkdir", "ureq"]
plugin = ["zellij-tile", "colored"]

[[bin]]
name = "zellij-cockpit"
path = "src/bin/plugin.rs"
required-features = ["plugin"]

[[bin]]
name = "cockpit-helper"
path = "src/bin/helper.rs"
required-features = ["native"]
