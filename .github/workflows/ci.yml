name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --features native --all-targets -- -D warnings

      - name: Test
        run: just test

      # `just test` builds the native side only. The plugin is a separate
      # target, so without this nothing in src/bin/plugin.rs is ever compiled
      # here and a broken bar would still go green.
      - name: Build the plugin
        run: just build-plugin

      - name: Clippy the plugin
        run: cargo clippy --target wasm32-wasip1 --features plugin --bin zellij-cockpit -- -D warnings
